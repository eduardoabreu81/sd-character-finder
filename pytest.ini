[pytest]
# ``testpaths`` keeps a bare ``pytest`` run out of the ignored root-level
# test_df.py scratch script, which imports gradio and is not part of the suite.
testpaths = tests
# The suite imports ``scripts.*`` and ``wildcard_creator.*`` from the repository
# root, and neither is an installed package. Pinning the path here keeps the
# suite working regardless of how pytest is invoked.
pythonpath = .
